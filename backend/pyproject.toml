[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend authenticated by Supabase Auth"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "supabase>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
